name: Island checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Shared logic and version checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the single project version
        run: python3 tools/release.py check
      - name: Existing shared tests
        run: cargo test --locked -p poni-core -p studio-diorama

  windows:
    name: Windows compile and existing tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets
      - name: Existing Windows tests
        shell: pwsh
        run: |
          $started = Get-Date
          cargo test --locked --workspace -- --nocapture
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $started; Id = 1000, 1001 } -ErrorAction SilentlyContinue |
              Select-Object TimeCreated, Id, Message | Format-List
            # 保留并行运行的失败结果；串行重跑只用于定位现有测试的崩溃位置。
            cargo test --locked -p poni --bin poni -- --nocapture --test-threads=1
            exit $testExit
          }
      - run: cargo build --locked --release -p poni
      - name: Existing Windows scene check
        shell: pwsh
        run: |
          # GUI 程序必须等待进程退出，再读取它自身的结果。
          $scene = Start-Process -FilePath target\release\poni.exe -ArgumentList '--selftest', 'selftest-out' -PassThru
          $null = $scene.Handle
          if (-not $scene.WaitForExit(180000)) {
            $scene.Kill()
            throw "Windows scene check timed out after 180 seconds"
          }
          Get-Content selftest-out\home\cache\poni.log -Tail 80 -ErrorAction SilentlyContinue
          Write-Host "Windows scene check exit code: $($scene.ExitCode)"
          if ($scene.ExitCode -ne 0) { throw "Windows scene check failed with exit code $($scene.ExitCode)" }
          if (-not (Test-Path selftest-out\report.json)) { throw "Windows scene check did not write its report" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check-results
          path: selftest-out
          if-no-files-found: warn

  mac:
    name: Mac compile, existing tests and previews
    runs-on: macos-15
    env:
      # 邮件翻译桥使用 macOS 26 SDK；runner 默认仍是 Xcode 16。
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p poni
      - name: Existing offscreen scenes
        run: |
          target/release/poni --render previews --theme pill
          target/release/poni --render previews-narrow --theme pill --width 480
          target/release/poni --render previews-codex --theme pill --codex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-check-previews
          path: |
            previews
            previews-narrow
            previews-codex
          if-no-files-found: warn
